<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador Avanzado de Auditoría</title>
    <style>
        :root {
            --primary: #1e293b;
            --secondary: #2563eb;
            --success: #16a34a;
            --danger: #dc2626;
            --background: #f8fafc;
            --card: #ffffff;
            --text: #0f172a;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--background);
            color: var(--text);
            line-height: 1.5;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
            background: var(--card);
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1);
        }

        h1 {
            color: var(--primary);
            text-align: center;
            margin-bottom: 5px;
            font-size: 1.8rem;
        }

        p.subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
            font-size: 0.95rem;
        }

        .progress-bar-container {
            width: 100%;
            background-color: #e2e8f0;
            border-radius: 10px;
            height: 10px;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: var(--secondary);
            transition: width 0.3s ease;
        }

        .question-card {
            display: none;
        }

        .question-card.active {
            display: block;
        }

        .question-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 20px;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background-color: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            padding: 14px 18px;
            font-size: 0.95rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
            color: var(--text);
            line-height: 1.4;
        }

        .option-btn:hover {
            background-color: #f1f5f9;
            border-color: #cbd5e1;
        }

        .option-btn.correct {
            background-color: #dcfce7 !important;
            border-color: var(--success) !important;
            color: #14532d;
            font-weight: 600;
        }

        .option-btn.incorrect {
            background-color: #fee2e2 !important;
            border-color: var(--danger) !important;
            color: #7f1d1d;
        }

        .feedback {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .feedback.correct {
            display: block;
            background-color: #dcfce7;
            color: #14532d;
            border: 1px solid #86efac;
        }

        .feedback.incorrect {
            display: block;
            background-color: #fee2e2;
            color: #7f1d1d;
            border: 1px solid #fca5a5;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        .btn-primary {
            background-color: var(--secondary);
            color: white;
        }

        .btn-primary:hover {
            background-color: #1d4ed8;
        }

        .btn:disabled {
            background-color: #cbd5e1;
            cursor: not-allowed;
        }

        .results-container {
            display: none;
            text-align: center;
        }

        .score-display {
            font-size: 3rem;
            font-weight: bold;
            color: var(--primary);
            margin: 15px 0;
        }

        .btn-restart {
            background-color: var(--success);
            color: white;
            margin-top: 20px;
        }

        .btn-restart:hover {
            background-color: #15803d;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Simulador Avanzado de Auditoría</h1>
    <p class="subtitle">Evaluación de Nivel Complejo | Opciones Homogéneas</p>

    <div class="progress-bar-container" id="progress-container">
        <div class="progress-bar" id="progress-bar"></div>
    </div>

    <!-- Preguntas -->
    <div id="quiz-container"></div>

    <!-- Resultados -->
    <div class="results-container" id="results-container">
        <h2>Evaluación Finalizada</h2>
        <p>Tu resultado global es:</p>
        <div class="score-display" id="score-text">0 / 0</div>
        <p id="feedback-message"></p>
        <button class="btn btn-restart" onclick="restartQuiz()">Reintentar examen</button>
    </div>

    <!-- Botones de Navegación -->
    <div class="controls" id="controls">
        <button class="btn btn-primary" id="prev-btn" onclick="prevQuestion()" disabled>Anterior</button>
        <button class="btn btn-primary" id="next-btn" onclick="nextQuestion()">Siguiente</button>
    </div>
</div>

<script>
    const questions = [
        {
            question: "1. Una firma contable independiente realiza un examen para validar si los estados financieros presentados reflejan fielmente la situación de una empresa. ¿A qué tipo de auditoría y objetivo corresponde este trabajo?",
            options: [
                "A) Auditoría interna enfocada en la detección preventiva de cuellos de botella en la producción.",
                "B) Auditoría externa enfocada en emitir una opinión independiente sobre la información auditada.",
                "C) Auditoría de cumplimiento enfocada exclusivamente en el diseño de manuales de procedimientos.",
                "D) Auditoría interna enfocada en sancionar a los directivos por el incumplimiento de las NIF."
            ],
            correct: 1,
            explanation: "La auditoría externa la realiza un auditor independiente para emitir una opinión profesional e independiente sobre la información analizada."
        },
        {
            question: "2. Si la administración de una empresa requiere verificar que el departamento de bodega registre correctamente cada salida de mercadería para evitar pérdidas, ¿qué tipo de auditoría debe ejecutar y por qué?",
            options: [
                "A) Auditoría externa, porque requiere un dictamen formal válido únicamente para instituciones bancarias.",
                "B) Auditoría informática, porque evalúa exclusivamente el mantenimiento de los servidores de la empresa.",
                "C) Auditoría interna, porque revisa los procesos, controles y actividades dentro de la organización.",
                "D) Auditoría preventiva, porque su único propósito es sancionar al personal del área de inventarios."
            ],
            correct: 2,
            explanation: "La auditoría interna se realiza dentro de la propia organización para revisar y mejorar sus procesos, controles y actividades."
        },
        {
            question: "3. En el ámbito contable, las Normas de Información Financiera (NIF) cumplen un rol técnico fundamental. ¿Cuál de las siguientes afirmaciones define su propósito exacto?",
            options: [
                "A) Regulan la metodología para estructurar el cronograma de actividades de una auditoría informática.",
                "B) Guían los procedimientos mediante los cuales se diseñan y aplican los controles de acceso lógico.",
                "C) Establecen los lineamientos para la preparación y presentación de la información financiera.",
                "D) Definen las sanciones legales que deben aplicarse a los auditores independientes en su informe."
            ],
            correct: 2,
            explanation: "Las NIF son las normas que establecen formalmente cómo se debe preparar y presentar la información financiera de una empresa."
        },
        {
            question: "4. Durante la emisión del dictamen final, el auditor encuentra incorrecciones materiales que no son generalizadas pero modifican su dictamen final. ¿Qué norma internacional aplica y de qué trata?",
            options: [
                "A) NIA 705, la cual trata sobre las modificaciones a la opinión del auditor en su informe final.",
                "B) NIA 700, la cual regula exclusivamente el levantamiento de evidencias en pruebas de cumplimiento.",
                "C) NIF 82, la cual establece la diferencia entre los controles informáticos preventivos y detectivos.",
                "D) NIA 139, la cual especifica la redacción obligatoria del programa de actividades de inventario."
            ],
            correct: 0,
            explanation: "La NIA 705 trata específicamente sobre las modificaciones a la opinión del auditor en su informe (opinión con salvedades, adversa o denegación)."
        },
        {
            question: "5. Para evitar que usuarios no autorizados accedan a la base de datos de nómina, la empresa exige autenticación mediante usuario y contraseña. ¿Qué tipo de control es y cómo actúa?",
            options: [
                "A) Control Detectivo, porque actúa cuando ocurre la falla identificando al usuario infractor.",
                "B) Control Correctivo, porque actúa después del problema solucionando las fugas de información.",
                "C) Control Preventivo, porque actúa antes de que ocurra el problema con el objetivo de evitarlo.",
                "D) Control Directivo, porque actúa fijando políticas generales de contratación en la empresa."
            ],
            correct: 2,
            explanation: "Es un Control Preventivo porque actúa ANTES de que ocurra un evento no deseado con la finalidad de evitarlo."
        },
        {
            question: "6. Un equipo de seguridad informática analiza los registros de auditoría (logs) a fin de mes y descubre que hubo un intento de acceso no autorizado. ¿Qué control se ha puesto en práctica?",
            options: [
                "A) Control Preventivo, debido a que logró impedir el daño total de las bases de datos del sistema.",
                "B) Control Detectivo, debido a que permitió encontrar una situación irregular o un problema sucedido.",
                "C) Control Correctivo, debido a que modificó inmediatamente los permisos del usuario en la red.",
                "D) Control Normativo, debido a que verifica el cumplimiento de las políticas de contraseñas de las NIF."
            ],
            correct: 1,
            explanation: "Es un Control Detectivo porque actúa en o después del evento y su función clave es encontrar/detectar la irregularidad."
        },
        {
            question: "7. Una vez detectado que una cuenta de usuario realizó descargas masivas no autorizadas, el administrador bloquea el usuario y reconfigura los permisos. ¿A qué categoría pertenece esta acción?",
            options: [
                "A) Control Correctivo, ya que su propósito final es solucionar un problema que previamente fue detectado.",
                "B) Control Preventivo, ya que evita que el resto de servidores sufran alteraciones en sus registros.",
                "C) Control Detectivo, ya que identifica los accesos no autorizados mediante una revisión de red.",
                "D) Control de Alcance, ya que restringe los límites de revisión que tendrá el auditor informático."
            ],
            correct: 0,
            explanation: "El Control Correctivo actúa después de que el problema fue detectado y su objetivo principal es solucionarlo."
        },
        {
            question: "8. Al definir los límites de una auditoría, el auditor especifica que evaluará únicamente el módulo de compras, los usuarios del sistema contable y la red local. ¿Qué elemento de planificación redactó?",
            options: [
                "A) El Objetivo, porque explica el propósito final que busca alcanzar la revisión en los sistemas.",
                "B) El Alcance, porque define los límites e indica qué elementos serán revisados y cuáles no.",
                "C) La Metodología, porque especifica la secuencia de pruebas que ejecutará el equipo técnico.",
                "D) El Programa, porque lista los responsables directos y las evidencias que se revisarán en el mes."
            ],
            correct: 1,
            explanation: "El Alcance establece los límites de la auditoría, delimitando qué sistemas, procesos o áreas serán analizados y cuáles quedan fuera."
        },
        {
            question: "9. Si en la fase de planificación se establece que la evaluación abarcará la información comprendida entre el 01 de enero y el 30 de junio del año 2026, el auditor está delimitando:",
            options: [
                "A) El Cronograma de actividades de la auditoría.",
                "B) El Alcance de los procedimientos de mitigación.",
                "C) El Periodo de revisión de la auditoría informática.",
                "D) Los Recursos necesarios para la ejecución del plan."
            ],
            correct: 2,
            explanation: "El Periodo de revisión determina expresamente el lapso de tiempo (desde cuándo hasta cuándo) en el cual se analizarán las actividades e información."
        },
        {
            question: "10. La identificación de riesgos en la planificación de una auditoría informática tiene como propósito fundamental:",
            options: [
                "A) Detallar el número exacto de computadores y licencias de software que el equipo auditor utilizará.",
                "B) Determinar las posibles amenazas que puedan afectar la seguridad, disponibilidad o confidencialidad.",
                "C) Asignar los roles de trabajo específicos entre el auditor líder y los analistas de soporte técnico.",
                "D) Establecer la fecha de la reunión inicial con los directivos para la presentación del informe final."
            ],
            correct: 1,
            explanation: "La Identificación de riesgos consiste en determinar amenazas o fallas potenciales (accesos no autorizados, ataques, pérdidas) que comprometan la información."
        },
        {
            question: "11. ¿En qué se diferencia principalmente la 'Identificación de Riesgos' del 'Cronograma de Actividades'?",
            options: [
                "A) Los riesgos definen las herramientas de software; el cronograma define la opinión modificada.",
                "B) Los riesgos establecen las metodologías de análisis; el cronograma lista el equipo de apoyo.",
                "C) Los riesgos anticipan problemas potenciales; el cronograma organiza tareas, fechas y responsables.",
                "D) Los riesgos delimitan los sistemas a evaluar; el cronograma establece el alcance del informe."
            ],
            correct: 2,
            explanation: "La Identificación de Riesgos prevé posibles amenazas; el Cronograma de Actividades planifica el trabajo en el tiempo asignando fechas, responsables y tareas."
        },
        {
            question: "12. En la elaboración del programa de auditoría informática, ¿a qué hace referencia exacta el término 'Procedimiento'?",
            options: [
                "A) A la técnica mediante la cual se obtiene la evidencia, como la observación o el análisis.",
                "B) A la actividad o revisión específica que el auditor va a realizar sobre el sistema o área.",
                "C) Al resultado esperado que el auditor prevé obtener tras aplicar la prueba de cumplimiento.",
                "D) Al tipo de documento o registro que se solicita al cliente para validar una transacción."
            ],
            correct: 1,
            explanation: "En el programa de auditoría, el Procedimiento responde al 'qué reviso' (la actividad o revisión concreta que ejecutará el auditor)."
        },
        {
            question: "13. ¿Cómo se relacionan la 'Técnica de auditoría' y la 'Evidencia requerida' dentro de la estructura de un programa de trabajo?",
            options: [
                "A) La técnica es el documento a comprobar; la evidencia es el límite de la auditoría informática.",
                "B) La técnica es el resultado esperado; la evidencia es el responsable de ejecutar la prueba técnica.",
                "C) La técnica es el método utilizado para revisar; la evidencia es la información utilizada para comprobar.",
                "D) La técnica define los riesgos identificados; la evidencia representa la NIA aplicada al proceso."
            ],
            correct: 2,
            explanation: "La Técnica es el método o forma empleada para revisar (cómo reviso), mientras que la Evidencia es la documentación con la que se comprueba (con qué compruebo)."
        },
        {
            question: "14. El auditor aplica la técnica de 'Prueba de cumplimiento' sobre la directiva de seguridad de acceso. ¿Cuál es la evidencia requerida y el resultado esperado correspondiente?",
            options: [
                "A) Evidencia: Lista de usuarios | Resultado esperado: Modificación de la NIA 705.",
                "B) Evidencia: Políticas de seguridad | Resultado esperado: Contraseñas seguras.",
                "C) Evidencia: Reportes de backup | Resultado esperado: Datos de inventario correctos.",
                "D) Evidencia: Base de datos | Resultado esperado: Bloqueo inmediato de usuarios."
            ],
            correct: 1,
            explanation: "Según el cuadro del programa de la guía, al evaluar contraseñas con 'Prueba de cumplimiento', la evidencia son las 'Políticas de seguridad' y el resultado son 'Contraseñas seguras'."
        },
        {
            question: "15. Si el procedimiento programado es 'Verificar registros de inventario' mediante la técnica de 'Análisis' y la evidencia es la 'Base de datos', el resultado esperado es:",
            options: [
                "A) La obtención de usuarios debidamente autorizados en el sistema.",
                "B) La verificación de que la información se encuentra respaldada y protegida.",
                "C) La validación de que los datos almacenados se encuentran correctos.",
                "D) La aplicación de un control correctivo inmediato sobre los servidores."
            ],
            correct: 2,
            explanation: "De acuerdo con el programa estructurado en la guía, la verificación de inventario busca como resultado esperado contar con 'Datos correctos'."
        }
    ];

    let currentQuestion = 0;
    let score = 0;
    let userAnswers = new Array(questions.length).fill(null);

    const quizContainer = document.getElementById('quiz-container');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const progressBar = document.getElementById('progress-bar');

    function renderQuiz() {
        quizContainer.innerHTML = '';
        questions.forEach((q, index) => {
            const card = document.createElement('div');
            card.className = `question-card ${index === 0 ? 'active' : ''}`;
            card.id = `q-${index}`;

            const title = document.createElement('div');
            title.className = 'question-title';
            title.innerText = q.question;
            card.appendChild(title);

            const optionsContainer = document.createElement('div');
            optionsContainer.className = 'options-container';

            q.options.forEach((opt, optIdx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => selectOption(index, optIdx);
                optionsContainer.appendChild(btn);
            });

            card.appendChild(optionsContainer);

            const feedback = document.createElement('div');
            feedback.className = 'feedback';
            feedback.id = `feedback-${index}`;
            card.appendChild(feedback);

            quizContainer.appendChild(card);
        });
        updateProgress();
    }

    function selectOption(questionIdx, optionIdx) {
        if (userAnswers[questionIdx] !== null) return;

        userAnswers[questionIdx] = optionIdx;
        const q = questions[questionIdx];
        const card = document.getElementById(`q-${questionIdx}`);
        const buttons = card.querySelectorAll('.option-btn');
        const feedback = document.getElementById(`feedback-${questionIdx}`);

        buttons.forEach((btn, idx) => {
            btn.disabled = true;
            if (idx === q.correct) {
                btn.classList.add('correct');
            }
            if (idx === optionIdx && optionIdx !== q.correct) {
                btn.classList.add('incorrect');
            }
        });

        if (optionIdx === q.correct) {
            score++;
            feedback.innerText = "¡Respuesta Correcta! " + q.explanation;
            feedback.className = "feedback correct";
        } else {
            feedback.innerText = "Respuesta Incorrecta. " + q.explanation;
            feedback.className = "feedback incorrect";
        }
    }

    function showQuestion(index) {
        document.querySelectorAll('.question-card').forEach((card, idx) => {
            card.classList.toggle('active', idx === index);
        });

        prevBtn.disabled = index === 0;
        
        if (index === questions.length - 1) {
            nextBtn.innerText = "Finalizar Examen";
        } else {
            nextBtn.innerText = "Siguiente";
        }

        updateProgress();
    }

    function nextQuestion() {
        if (currentQuestion < questions.length - 1) {
            currentQuestion++;
            showQuestion(currentQuestion);
        } else {
            showResults();
        }
    }

    function prevQuestion() {
        if (currentQuestion > 0) {
            currentQuestion--;
            showQuestion(currentQuestion);
        }
    }

    function updateProgress() {
        const progress = ((currentQuestion + 1) / questions.length) * 100;
        progressBar.style.width = `${progress}%`;
    }

    function showResults() {
        document.getElementById('quiz-container').style.display = 'none';
        document.getElementById('controls').style.display = 'none';
        document.getElementById('progress-container').style.display = 'none';

        const resultsContainer = document.getElementById('results-container');
        resultsContainer.style.display = 'block';

        const scoreText = document.getElementById('score-text');
        scoreText.innerText = `${score} / ${questions.length}`;

        const percentage = (score / questions.length) * 100;
        const feedbackMsg = document.getElementById('feedback-message');

        if (percentage >= 85) {
            feedbackMsg.innerText = "¡Excelente nivel analítico! Tienes una comprensión sólida y profunda del contenido de la guía.";
            feedbackMsg.style.color = "var(--success)";
        } else if (percentage >= 65) {
            feedbackMsg.innerText = "Buen desempeño. Has dominado los conceptos generales, pero te conviene repasar las sutilezas entre los tipos de controles y los elementos del programa.";
            feedbackMsg.style.color = "var(--secondary)";
        } else {
            feedbackMsg.innerText = "Nivel insuficiente. Se recomienda volver a estudiar la guía analizando las diferencias entre preventivo/detectivo/correctivo y la planificación.";
            feedbackMsg.style.color = "var(--danger)";
        }
    }

    function restartQuiz() {
        currentQuestion = 0;
        score = 0;
        userAnswers = new Array(questions.length).fill(null);

        document.getElementById('quiz-container').style.display = 'block';
        document.getElementById('controls').style.display = 'flex';
        document.getElementById('progress-container').style.display = 'block';
        document.getElementById('results-container').style.display = 'none';

        renderQuiz();
        showQuestion(0);
    }

    renderQuiz();
</script>

</body>
</html>
