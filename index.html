<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Examen de Redes Avanzado</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        .no-select {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        @keyframes pulse-red {
            0%, 100% { background-color: rgba(239, 68, 68, 0.2); }
            50% { background-color: rgba(239, 68, 68, 0.5); }
        }
        .timer-warning {
            animation: pulse-red 1s infinite;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen no-select font-sans antialiased pb-12">

    <!-- Header Fijo -->
    <header class="sticky top-0 z-50 bg-slate-800/90 backdrop-blur-md border-b border-slate-700 shadow-lg">
        <div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-network-wired text-indigo-400 text-2xl"></i>
                <h1 class="font-bold text-lg text-white">Simulador de Redes <span class="text-xs bg-indigo-600 text-indigo-100 px-2 py-0.5 rounded-full uppercase tracking-wider ml-2">23 Preguntas</span></h1>
            </div>
            
            <div class="flex items-center space-x-6">
                <!-- Temporizador -->
                <div id="timerContainer" class="flex items-center space-x-2 bg-slate-900 border border-slate-700 px-3 py-1.5 rounded-lg">
                    <i class="fa-regular fa-clock text-indigo-400"></i>
                    <span id="timer" class="font-mono font-bold text-indigo-200">15:00</span>
                </div>
                <!-- Progreso -->
                <div class="text-right hidden sm:block">
                    <div class="text-xs text-slate-400">Respondidas</div>
                    <div class="font-bold text-indigo-300"><span id="answeredCount">0</span> / 23</div>
                </div>
            </div>
        </div>
        <!-- Barra de Progreso Superior -->
        <div class="w-full bg-slate-700 h-1.5">
            <div id="progressBar" class="bg-indigo-500 h-1.5 w-0 transition-all duration-300"></div>
        </div>
    </header>

    <div class="max-w-4xl mx-auto px-4 mt-6">

        <!-- Selector de Modo de Examen -->
        <div id="modeSelector" class="bg-slate-800 rounded-xl p-6 border border-slate-700 mb-8 shadow-xl">
            <h2 class="text-xl font-bold mb-4 text-white flex items-center gap-2">
                <i class="fa-solid fa-sliders text-indigo-400"></i> Configuración de la Prueba
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <button onclick="setMode('exam')" id="btnModeExam" class="p-4 rounded-lg border-2 border-indigo-500 bg-indigo-950/40 text-left hover:border-indigo-400 transition-all">
                    <div class="font-bold text-indigo-300 mb-1 flex items-center justify-between">
                        Modo Examen <i class="fa-solid fa-stopwatch"></i>
                    </div>
                    <div class="text-xs text-slate-400">Tiempo límite de 15 minutos. Evaluación al finalizar o agotar el tiempo.</div>
                </button>
                <button onclick="setMode('sudden_death')" id="btnModeDeath" class="p-4 rounded-lg border-2 border-slate-700 bg-slate-900/40 text-left hover:border-indigo-400 transition-all">
                    <div class="font-bold text-slate-300 mb-1 flex items-center justify-between">
                        Muerte Súbita <i class="fa-solid fa-skull"></i>
                    </div>
                    <div class="text-xs text-slate-400">El examen se termina inmediatamente al cometer el primer error.</div>
                </button>
                <button onclick="setMode('practice')" id="btnModePractice" class="p-4 rounded-lg border-2 border-slate-700 bg-slate-900/40 text-left hover:border-indigo-400 transition-all">
                    <div class="font-bold text-slate-300 mb-1 flex items-center justify-between">
                        Práctica Libre <i class="fa-solid fa-graduation-cap"></i>
                    </div>
                    <div class="text-xs text-slate-400">Sin límite de tiempo. Retroalimentación detallada inmediata.</div>
                </button>
            </div>
        </div>

        <!-- Preguntas Container -->
        <div id="quizContainer" class="space-y-6">
            <!-- Se generan dinámicamente -->
        </div>

        <!-- Panel de Resultados (Oculto al inicio) -->
        <div id="resultsPanel" class="hidden bg-slate-800 border border-slate-700 rounded-2xl p-8 mt-8 text-center shadow-2xl">
            <div class="inline-flex items-center justify-center w-20 h-20 bg-indigo-600/20 text-indigo-400 rounded-full mb-4 border border-indigo-500/30">
                <i class="fa-solid fa-trophy text-4xl"></i>
            </div>
            <h2 class="text-3xl font-extrabold text-white mb-2">Prueba Finalizada</h2>
            <p id="resultsSubtitle" class="text-slate-400 text-sm mb-6">Aquí tienes el desglose de tu rendimiento</p>

            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
                <div class="bg-slate-900 p-4 rounded-xl border border-slate-700">
                    <span class="text-xs text-slate-400 block uppercase font-semibold">Puntaje</span>
                    <span id="scoreText" class="text-3xl font-extrabold text-indigo-400">0/23</span>
                </div>
                <div class="bg-slate-900 p-4 rounded-xl border border-slate-700">
                    <span class="text-xs text-slate-400 block uppercase font-semibold">Porcentaje</span>
                    <span id="percentText" class="text-3xl font-extrabold text-emerald-400">0%</span>
                </div>
                <div class="bg-slate-900 p-4 rounded-xl border border-slate-700">
                    <span class="text-xs text-slate-400 block uppercase font-semibold">Tiempo Usado</span>
                    <span id="timeUsedText" class="text-3xl font-extrabold text-amber-400">00:00</span>
                </div>
                <div class="bg-slate-900 p-4 rounded-xl border border-slate-700">
                    <span class="text-xs text-slate-400 block uppercase font-semibold">Estado</span>
                    <span id="statusText" class="text-xl font-bold text-slate-200 mt-1 block">---</span>
                </div>
            </div>

            <div class="flex justify-center gap-4">
                <button onclick="restartQuiz()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 px-8 rounded-xl shadow-lg transition-all flex items-center gap-2">
                    <i class="fa-solid fa-rotate-right"></i> Reintentar Simulador
                </button>
            </div>
        </div>

        <!-- Botón de Envío Examen -->
        <div id="submitContainer" class="mt-8 text-center">
            <button onclick="finishExam()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-extrabold text-lg py-4 px-12 rounded-xl shadow-xl transition-all border border-indigo-400 transform hover:-translate-y-1">
                Finalizar y Calificar
            </button>
        </div>

    </div>

    <script>
        const rawQuestions = [
            {
                q: "¿Cuál fue la meta fundamental del DARPA?",
                correct: "Crear una red que siguiera funcionando aunque fallaran algunos nodos.",
                distractors: [
                    "Desarrollar el protocolo HTTP para la transferencia global de hipertexto.",
                    "Interconectar únicamente computadoras centrales gubernamentales mediante fibra óptica.",
                    "Establecer un algoritmo rígido de direccionamiento estático global."
                ]
            },
            {
                q: "¿Qué significa \"End to End principle\"?",
                correct: "Que el control de la comunicación lo hacen los dispositivos finales (hosts).",
                distractors: [
                    "Que los conmutadores y routers intermedios realizan el control de errores de aplicación.",
                    "Que la topología lógica debe estar conectada mediante enlaces punto a punto cerrados.",
                    "Que la capa de red garantiza la encriptación física del cableado."
                ]
            },
            {
                q: "¿Del modelo OSI, qué capa corresponde al acceso de red del TCP/IP?",
                correct: "Las Capas Física y de Enlace de datos (Capas 1 y 2).",
                distractors: [
                    "Únicamente la Capa de Red (Capa 3).",
                    "La Capa de Transporte junto a la Capa de Sesión (Capas 4 y 5).",
                    "La Capa de Aplicación, Presentación y Sesión (Capas 5, 6 y 7)."
                ]
            },
            {
                q: "¿Qué capa del modelo OSI corresponde a la capa de Internet del modelo TCP/IP?",
                correct: "La capa de Red (Capa 3).",
                distractors: [
                    "La capa de Enlace de datos (Capa 2).",
                    "La capa de Transporte (Capa 4).",
                    "La capa de Sesión (Capa 5)."
                ]
            },
            {
                q: "¿Cuál es la función principal de la capa de transporte de la arquitectura TCP/IP?",
                correct: "Garantizar la entrega de datos de extremo a extremo de forma confiable.",
                distractors: [
                    "Establecer el direccionamiento IP físico de las tarjetas de red de origen y destino.",
                    "Rutear los paquetes mediante la tabla de rutas hacia la interfaz más cercana.",
                    "Codificar los bits en impulsos eléctricos o señales ópticas sobre el medio."
                ]
            },
            {
                q: "¿Cuál es la diferencia entre el protocolo TCP y UDP y en qué capa se encuentran?",
                correct: "Están en la capa de Transporte. TCP es Seguro / orientado a conexión; UDP es rápido / sin conexión.",
                distractors: [
                    "Están en la capa de Internet. TCP es para multicast; UDP es para unicast.",
                    "Están en la capa de Aplicación. TCP usa conexiones cifradas SSL; UDP envía texto plano.",
                    "Están en la capa de Transporte. TCP es rápido / sin conexión; UDP es Seguro / orientado a conexión."
                ]
            },
            {
                q: "¿Qué protocolo opera en la capa de Internet?",
                correct: "El protocolo IP (junto con ICMP y ARP).",
                distractors: [
                    "El protocolo TCP (junto con UDP y TLS).",
                    "El protocolo Ethernet (junto con 802.11 Wi-Fi).",
                    "El protocolo BGP (junto con OSPF y RIP)."
                ]
            },
            {
                q: "¿Cuál es el tamaño mínimo del encabezado?",
                correct: "20 bytes (en IPv4).",
                distractors: [
                    "32 bytes (en IPv4).",
                    "16 bytes (en IPv4).",
                    "64 bytes (en IPv4)."
                ]
            },
            {
                q: "¿Cómo se calcula la longitud mínima del encabezado IHL?",
                correct: "multiplicando el valor mínimo del IHL (5) por 4 bytes = 20 bytes.",
                distractors: [
                    "multiplicando el valor del IHL (8) por 2 bytes = 16 bytes.",
                    "sumando el valor IHL al valor de la máscara de subred predeterminada.",
                    "multiplicando el valor máximo de campo (15) por 3 bytes = 45 bytes."
                ]
            },
            {
                q: "¿Qué es TTL? / ¿Qué hace? / ¿Qué significa TTL?",
                correct: "Significa Time to live (Tiempo de vida). Que hace: Evita que los paquetes giren infinitamente en la red eliminándolos al llegar a cero.",
                distractors: [
                    "Significa Total Traffic Limit. Que hace: Mide el consumo en megabytes del enlace en tiempo real.",
                    "Significa Transport Layer Timing. Que hace: Sincroniza los relojes de hardware entre servidores primarios.",
                    "Significa Time to live (Tiempo de vida). Que hace: Aumenta la velocidad del router cada vez que pasa por un salto."
                ]
            },
            {
                q: "¿Qué es la porción de Red y qué es la porción de hosts?",
                correct: "Porción de Red: Identifica la red especifica a la que pertenece el dispositivo. Porción de hosts: Identifica de forma única al dispositivo (hosts) dentro de esa red.",
                distractors: [
                    "Porción de Red: Identifica la dirección MAC física. Porción de hosts: Identifica el puerto de aplicación.",
                    "Porción de Red: Identifica los primeros 8 bits siempre. Porción de hosts: Identifica los últimos 8 bits siempre.",
                    "Porción de Red: Identifica al dispositivo único. Porción de hosts: Identifica la red completa a la que pertenece."
                ]
            },
            {
                q: "¿De cuántos bits es la máscara de red 255.255.255.0?",
                correct: "Es de 24 bits (escrita como /24).",
                distractors: [
                    "Es de 16 bits (escrita como /16).",
                    "Es de 32 bits (escrita como /32).",
                    "Es de 8 bits (escrita como /8)."
                ]
            },
            {
                q: "¿Qué es loopback y para qué se utiliza?",
                correct: "Una dirección IP especial (127.0.0.1) que apunta al propio equipo. Sirve para diagnóstico interno y probar la pila de protocolos TCP/IP sin enviar datos a la red externa.",
                distractors: [
                    "Un puerto de red público usado para ruteo estático directo hacia el servidor DNS.",
                    "Una dirección MAC reservada para transmisiones de broadcast hacia el switch central.",
                    "Un comando de consola exclusivo de routers Cisco para reiniciar las interfaces activas."
                ]
            },
            {
                q: "¿Qué es CIDR y su ventaja?",
                correct: "Enrutamiento sin clase que permite asignar bloques de direcciones IP con máscaras de longitud variable. Ventajas: Es más flexible que las clases antiguas y evita el desperdicio de direcciones IP.",
                distractors: [
                    "Protocolo de enrutamiento interno con clase. Ventajas: Simplifica el conteo de saltos en redes pequeñas.",
                    "Algoritmo de cifrado de paquetes IP. Ventajas: Protege las cabeceras contra inspección profunda.",
                    "Técnica de conmutación de etiquetas. Ventajas: Reemplaza por completo el uso de tablas ARP."
                ]
            },
            {
                q: "¿Qué es un enrutamiento estático y dinámico?",
                correct: "Estático: Configuración manual de rutas; no cambia sola. Dinámico: los routers aprenden y actualizan las rutas automáticamente.",
                distractors: [
                    "Estático: Configuración automática por DHCP. Dinámico: Configuración por comandos en línea.",
                    "Estático: Exclusivo para switches Layer 2. Dinámico: Exclusivo para routers inalámbricos.",
                    "Estático: Se actualiza cada 30 segundos. Dinámico: Permanece fijo en la memoria NVRAM."
                ]
            },
            {
                q: "¿Qué es el RIPv2 y características?",
                correct: "Protocolo de enrutamiento básico para redes pequeñas. Características: Soporta VLSM, usa multicast y tiene autenticación.",
                distractors: [
                    "Protocolo de estado de enlace para redes corporativas. Características: Sin soporte a VLSM y usa unicast.",
                    "Protocolo de vector distancia avanzado exclusivo de Cisco. Características: Usa métricas compuestas de ancho de banda.",
                    "Protocolo de capa de aplicación. Características: Transmite tablas completas en texto plano sin autenticación."
                ]
            },
            {
                q: "Límite de Salto del RIPv2 ?",
                correct: "15 saltos máximo (16 es inalcanzable).",
                distractors: [
                    "255 saltos máximo (256 es inalcanzable).",
                    "100 saltos máximo (101 es inalcanzable).",
                    "10 saltos máximo (11 es inalcanzable)."
                ]
            },
            {
                q: "¿Qué es EIGRP y sus características?",
                correct: "Protocolo de enrutamiento avanzado de Cisco. Características: Muy rápido (usa algoritmo DUAL) y calcula rutas por ancho de banda y retardo.",
                distractors: [
                    "Protocolo estándar abierto sin clase. Características: Usa el algoritmo Dijkstra y cuenta únicamente saltos.",
                    "Protocolo de enrutamiento exterior para Internet. Características: Basado en políticas de sistemas autónomos.",
                    "Protocolo estático asistido por hardware. Características: Requiere configuración manual de métricas."
                ]
            },
            {
                q: "¿Cuál es la métrica utilizada por RIPv2?",
                correct: "Conteo de Saltos (Hop Count).",
                distractors: [
                    "Ancho de banda y Retardo.",
                    "Coste del enlace basado en la velocidad relativa.",
                    "Carga del canal y Fiabilidad."
                ]
            },
            {
                q: "¿Cuál es la diferencia entre FLSM y ULSM?",
                correct: "FLSM: Todas las subredes tienen el mismo tamaño (máscara fija). VLSM: las Subredes tienen diferentes tamaños según la necesidad de hosts (máscara variable).",
                distractors: [
                    "FLSM: Utiliza máscaras variables según hosts. VLSM: Divide la red en subredes exactamente iguales.",
                    "FLSM: Exclusivo de IPv6. VLSM: Diseñado únicamente para direccionamiento clase A en IPv4.",
                    "FLSM: Permite el ahorro máximo de direcciones IP. VLSM: Genera desperdicio de direcciones IP por máscara fija."
                ]
            },
            {
                q: "¿Cuál es la fórmula para calcular el número de hosts?",
                correct: "2ⁿ - 2 (donde n es el número de bits dedicados a hosts).",
                distractors: [
                    "2ⁿ (donde n es el número de bits dedicados a la red).",
                    "2ⁿ + 2 (donde n es el número de bits de la máscara).",
                    "10ⁿ - 2 (donde n es el valor en decimal de la subred)."
                ]
            },
            {
                q: "Dirección de red y Broadcast ?",
                correct: "Dirección de red: la primera dirección IP de la Subred (identifica a la red). Broadcast: la última dirección IP de la subred (envía datos a todos los hosts).",
                distractors: [
                    "Dirección de red: la última IP asignable. Broadcast: la primera IP reservada para el Gateway por defecto.",
                    "Dirección de red: cualquier IP par dentro del rango. Broadcast: cualquier IP impar dentro del rango.",
                    "Dirección de red: la IP asignada al router principal. Broadcast: la IP 127.0.0.1 reservada."
                ]
            },
            {
                q: "¿Para qué se utiliza el subneteo?",
                correct: "Para dividir una red grande en redes más pequeñas, optimizando el rendimiento y la seguridad.",
                distractors: [
                    "Para convertir automáticamente direcciones IPv4 a formato IPv6 sin pérdida.",
                    "Para aumentar el número total de direcciones IP públicas asignadas por el proveedor.",
                    "Para evitar la configuración del protocolo ARP en los switches de capa de acceso."
                ]
            }
        ];

        let currentMode = 'exam'; // 'exam', 'sudden_death', 'practice'
        let questions = [];
        let userAnswers = {};
        let timerInterval = null;
        let timeRemaining = 15 * 60; // 15 minutos
        let timeElapsed = 0;

        // Anti-copia
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if (e.ctrlKey && (e.key === 'c' || e.key === 'u' || e.key === 's' || e.key === 'a')) {
                e.preventDefault();
            }
            if (e.key === 'F12') e.preventDefault();
        });

        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            let arr = [...array];
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [arr[currentIndex], arr[randomIndex]] = [arr[randomIndex], arr[currentIndex]];
            }
            return arr;
        }

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('btnModeExam').className = mode === 'exam' ? 'p-4 rounded-lg border-2 border-indigo-500 bg-indigo-950/40 text-left hover:border-indigo-400 transition-all' : 'p-4 rounded-lg border-2 border-slate-700 bg-slate-900/40 text-left hover:border-indigo-400 transition-all';
            document.getElementById('btnModeDeath').className = mode === 'sudden_death' ? 'p-4 rounded-lg border-2 border-rose-500 bg-rose-950/40 text-left hover:border-rose-400 transition-all' : 'p-4 rounded-lg border-2 border-slate-700 bg-slate-900/40 text-left hover:border-indigo-400 transition-all';
            document.getElementById('btnModePractice').className = mode === 'practice' ? 'p-4 rounded-lg border-2 border-emerald-500 bg-emerald-950/40 text-left hover:border-emerald-400 transition-all' : 'p-4 rounded-lg border-2 border-slate-700 bg-slate-900/40 text-left hover:border-indigo-400 transition-all';
            
            restartQuiz();
        }

        function initQuiz() {
            // Barajar preguntas
            questions = shuffle(rawQuestions).map(qObj => {
                const options = shuffle([
                    { text: qObj.correct, isCorrect: true },
                    ...qObj.distractors.map(d => ({ text: d, isCorrect: false }))
                ]);
                return {
                    q: qObj.q,
                    options: options,
                    correctText: qObj.correct
                };
            });

            userAnswers = {};
            timeRemaining = 15 * 60;
            timeElapsed = 0;
            
            renderQuestions();
            updateProgress();
            
            clearInterval(timerInterval);
            if (currentMode !== 'practice') {
                document.getElementById('timerContainer').classList.remove('hidden');
                timerInterval = setInterval(updateTimer, 1000);
            } else {
                document.getElementById('timerContainer').classList.add('hidden');
            }

            document.getElementById('resultsPanel').classList.add('hidden');
            document.getElementById('submitContainer').classList.remove('hidden');
        }

        function renderQuestions() {
            const container = document.getElementById('quizContainer');
            container.innerHTML = '';

            questions.forEach((q, idx) => {
                const card = document.createElement('div');
                card.className = "bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-md transition-all";
                card.id = `qCard_${idx}`;

                let optionsHTML = '';
                const letters = ['A', 'B', 'C', 'D'];

                q.options.forEach((opt, optIdx) => {
                    optionsHTML += `
                        <button onclick="selectOption(${idx}, ${optIdx})" id="opt_${idx}_${optIdx}" 
                            class="w-full text-left p-4 rounded-lg border border-slate-700 bg-slate-900/60 hover:bg-slate-700/50 hover:border-indigo-500/50 transition-all flex items-start space-x-3 group mb-2">
                            <span class="inline-flex items-center justify-center w-6 h-6 rounded-full bg-slate-800 border border-slate-600 text-xs font-bold text-slate-300 group-hover:border-indigo-400 group-hover:text-white shrink-0 mt-0.5">
                                ${letters[optIdx]}
                            </span>
                            <span class="text-slate-200 text-sm leading-relaxed">${escapeHTML(opt.text)}</span>
                        </button>
                    `;
                });

                card.innerHTML = `
                    <div class="flex items-start justify-between mb-4">
                        <h3 class="font-bold text-base text-white pr-4">
                            <span class="text-indigo-400 mr-1">${idx + 1}.</span> ${escapeHTML(q.q)}
                        </h3>
                        <span id="badge_${idx}" class="text-xs bg-slate-700 text-slate-400 px-2.5 py-1 rounded-full font-medium shrink-0">Pendiente</span>
                    </div>
                    <div class="space-y-2">
                        ${optionsHTML}
                    </div>
                    <div id="feedback_${idx}" class="mt-4 hidden p-3 rounded-lg text-xs leading-relaxed"></div>
                `;

                container.appendChild(card);
            });
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        function selectOption(qIdx, optIdx) {
            if (userAnswers[qIdx] !== undefined && currentMode !== 'practice') return; // Bloquear en examen si ya respondió

            userAnswers[qIdx] = optIdx;

            const q = questions[qIdx];
            const selectedOpt = q.options[optIdx];
            
            // Actualizar interfaz visual de la pregunta
            const card = document.getElementById(`qCard_${qIdx}`);
            const badge = document.getElementById(`badge_${qIdx}`);
            
            q.options.forEach((_, i) => {
                const btn = document.getElementById(`opt_${qIdx}_${i}`);
                btn.className = "w-full text-left p-4 rounded-lg border border-slate-700 bg-slate-900/60 text-slate-400 transition-all flex items-start space-x-3 mb-2 opacity-60";
            });

            const selectedBtn = document.getElementById(`opt_${qIdx}_${optIdx}`);

            if (currentMode === 'practice') {
                if (selectedOpt.isCorrect) {
                    selectedBtn.className = "w-full text-left p-4 rounded-lg border-2 border-emerald-500 bg-emerald-950/40 text-emerald-100 font-medium transition-all flex items-start space-x-3 mb-2 shadow-lg";
                    badge.className = "text-xs bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-2.5 py-1 rounded-full font-bold";
                    badge.textContent = "¡Correcto!";
                } else {
                    selectedBtn.className = "w-full text-left p-4 rounded-lg border-2 border-rose-500 bg-rose-950/40 text-rose-100 transition-all flex items-start space-x-3 mb-2 shadow-lg";
                    badge.className = "text-xs bg-rose-500/20 text-rose-400 border border-rose-500/30 px-2.5 py-1 rounded-full font-bold";
                    badge.textContent = "Incorrecto";
                    
                    // Mostrar también la correcta
                    q.options.forEach((o, i) => {
                        if (o.isCorrect) {
                            const cBtn = document.getElementById(`opt_${qIdx}_${i}`);
                            cBtn.className = "w-full text-left p-4 rounded-lg border-2 border-emerald-500 bg-emerald-950/20 text-emerald-200 transition-all flex items-start space-x-3 mb-2";
                        }
                    });
                }
            } else if (currentMode === 'sudden_death') {
                if (!selectedOpt.isCorrect) {
                    selectedBtn.className = "w-full text-left p-4 rounded-lg border-2 border-rose-500 bg-rose-950/40 text-rose-100 transition-all flex items-start space-x-3 mb-2";
                    badge.textContent = "Fallaste";
                    badge.className = "text-xs bg-rose-500/20 text-rose-400 border border-rose-500/30 px-2.5 py-1 rounded-full font-bold";
                    setTimeout(() => {
                        alert("¡Muerte Súbita! Has cometido un error. Examen finalizado.");
                        finishExam();
                    }, 300);
                    return;
                } else {
                    selectedBtn.className = "w-full text-left p-4 rounded-lg border-2 border-indigo-500 bg-indigo-950/50 text-indigo-100 transition-all flex items-start space-x-3 mb-2";
                    badge.className = "text-xs bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 px-2.5 py-1 rounded-full font-bold";
                    badge.textContent = "Respondida";
                }
            } else { // Examen normal
                selectedBtn.className = "w-full text-left p-4 rounded-lg border-2 border-indigo-500 bg-indigo-950/50 text-indigo-100 transition-all flex items-start space-x-3 mb-2";
                badge.className = "text-xs bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 px-2.5 py-1 rounded-full font-bold";
                badge.textContent = "Respondida";
            }

            updateProgress();
        }

        function updateProgress() {
            const answered = Object.keys(userAnswers).length;
            document.getElementById('answeredCount').textContent = answered;
            const pct = (answered / 23) * 100;
            document.getElementById('progressBar').style.width = `${pct}%`;
        }

        function updateTimer() {
            timeRemaining--;
            timeElapsed++;
            
            const minutes = Math.floor(timeRemaining / 60);
            const seconds = timeRemaining % 60;
            
            const timerEl = document.getElementById('timer');
            timerEl.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;

            if (timeRemaining <= 180) { // Últimos 3 min
                document.getElementById('timerContainer').classList.add('timer-warning', 'border-rose-500');
            }

            if (timeRemaining <= 0) {
                clearInterval(timerInterval);
                alert("¡El tiempo ha expirado! Se evaluará tu examen con las respuestas registradas.");
                finishExam();
            }
        }

        function finishExam() {
            clearInterval(timerInterval);
            
            let score = 0;
            questions.forEach((q, idx) => {
                const selectedOptIdx = userAnswers[idx];
                const card = document.getElementById(`qCard_${idx}`);
                const feedback = document.getElementById(`feedback_${idx}`);
                
                if (selectedOptIdx !== undefined) {
                    const selectedOpt = q.options[selectedOptIdx];
                    if (selectedOpt.isCorrect) {
                        score++;
                    }
                }

                // Revelar respuestas de todas las preguntas
                q.options.forEach((opt, optIdx) => {
                    const btn = document.getElementById(`opt_${idx}_${optIdx}`);
                    if (opt.isCorrect) {
                        btn.className = "w-full text-left p-4 rounded-lg border-2 border-emerald-500 bg-emerald-950/40 text-emerald-100 font-medium transition-all flex items-start space-x-3 mb-2";
                    } else if (optIdx === selectedOptIdx && !opt.isCorrect) {
                        btn.className = "w-full text-left p-4 rounded-lg border-2 border-rose-500 bg-rose-950/40 text-rose-100 transition-all flex items-start space-x-3 mb-2";
                    } else {
                        btn.className = "w-full text-left p-4 rounded-lg border border-slate-800 bg-slate-900/30 text-slate-500 transition-all flex items-start space-x-3 mb-2 opacity-40";
                    }
                });

                feedback.classList.remove('hidden');
                feedback.className = "mt-4 p-3 rounded-lg text-xs leading-relaxed border bg-slate-900 border-slate-700 text-slate-300";
                feedback.innerHTML = `<span class="font-bold text-indigo-400">Respuesta Oficial del Apunte:</span> ${escapeHTML(q.correctText)}`;
            });

            // Mostrar Resultados
            const percent = Math.round((score / 23) * 100);
            document.getElementById('scoreText').textContent = `${score}/23`;
            document.getElementById('percentText').textContent = `${percent}%`;
            
            const minU = Math.floor(timeElapsed / 60);
            const secU = timeElapsed % 60;
            document.getElementById('timeUsedText').textContent = `${minU.toString().padStart(2, '0')}:${secU.toString().padStart(2, '0')}`;

            const statusEl = document.getElementById('statusText');
            if (percent >= 85) {
                statusEl.textContent = "SOBRESALIENTE";
                statusEl.className = "text-xl font-bold text-emerald-400 mt-1 block";
                confetti({ particleCount: 120, spread: 70, origin: { y: 0.6 } });
            } else if (percent >= 70) {
                statusEl.textContent = "APROBADO";
                statusEl.className = "text-xl font-bold text-indigo-400 mt-1 block";
            } else {
                statusEl.textContent = "REPROBADO";
                statusEl.className = "text-xl font-bold text-rose-400 mt-1 block";
            }

            document.getElementById('resultsPanel').classList.remove('hidden');
            document.getElementById('submitContainer').classList.add('hidden');

            // Scroll suave hacia los resultados
            document.getElementById('resultsPanel').scrollIntoView({ behavior: 'smooth' });
        }

        function restartQuiz() {
            initQuiz();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Inicializar al cargar la página
        window.onload = initQuiz;
    </script>
</body>
</html>
