    var form = document.getElementById("cuestionario");
    var detalle = document.getElementById("detalle");
    var resultado = document.getElementById("resultado");
 
    function mezclar(a) {
      a = a.slice();
      for (var i = a.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = a[i]; a[i] = a[j]; a[j] = t;
      }
      return a;
    }
 
    function dibujar() {
      form.innerHTML = "";
      resultado.textContent = "";
      detalle.innerHTML = "";
      var num = 0;
      secciones.forEach(function (s) {
        if (!s[1].length) return;
        var h = document.createElement("h2");
        h.textContent = s[0] + " (" + s[1].length + ")";
        form.appendChild(h);
        s[1].forEach(function (n) {
          var p = preguntas[n];
          var sec = document.createElement("section");
          sec.className = "q";
          sec.id = "q" + n;
          var h3 = document.createElement("h3");
          h3.textContent = (++num) + ". " + p[0];
          sec.appendChild(h3);
          mezclar(p.slice(1)).forEach(function (op) {
            var lab = document.createElement("label");
            var inp = document.createElement("input");
            inp.type = "radio";
            inp.name = "p" + n;
            inp.value = op;
            inp.addEventListener("change", function () { responder(n); });
            lab.appendChild(inp);
            lab.appendChild(document.createTextNode(" " + op));
            sec.appendChild(lab);
          });
          form.appendChild(sec);
        });
      });
    }
 
    function responder(n) {
      var p = preguntas[n];
      var sec = document.getElementById("q" + n);
      var marcada = form.querySelector("input[name=p" + n + "]:checked");
      form.querySelectorAll("input[name=p" + n + "]").forEach(function (inp) {
        inp.disabled = true;
        if (inp.value === p[1]) inp.parentNode.classList.add("ok");
        else if (inp.checked) inp.parentNode.classList.add("bad");
      });
      if (marcada && marcada.value !== p[1]) {
        var caja = document.createElement("div");
        caja.className = "exp";
        var b = document.createElement("strong");
        b.textContent = "Respuesta correcta: ";
        caja.appendChild(b);
        caja.appendChild(document.createTextNode(p[1] + ". " + (explicaciones[n] || "")));
        sec.appendChild(caja);
      }
    }
 
    function calificar() {
      var aciertos = 0, sinResponder = 0;
      detalle.innerHTML = "";
      secciones.forEach(function (s) {
        var ok = 0;
        s[1].forEach(function (n) {
          var m = form.querySelector("input[name=p" + n + "]:checked");
          if (!m) sinResponder++;
          else if (m.value === preguntas[n][1]) { ok++; aciertos++; }
        });
        if (!s[1].length) return;
        var li = document.createElement("li");
        li.textContent = s[0] + ": " + ok + " de " + s[1].length;
        detalle.appendChild(li);
      });
      resultado.textContent = "Puntaje: " + aciertos + " de " + preguntas.length +
        (sinResponder ? " (" + sinResponder + " sin responder)" : "");
      resultado.scrollIntoView({ behavior: "smooth" });
    }
 
    document.getElementById("btnCalificar").addEventListener("click", calificar);
    document.getElementById("btnReiniciar").addEventListener("click", function () {
      dibujar();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
    dibujar();
